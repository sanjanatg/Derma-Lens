<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-surface-variant": "#46483e",
              "inverse-surface": "#31312c",
              "outline": "#77786d",
              "secondary": "#6f5a51",
              "on-primary-fixed": "#171e05",
              "inverse-primary": "#c2cba3",
              "secondary-fixed-dim": "#ddc1b6",
              "primary-container": "#a7b08a",
              "on-error": "#ffffff",
              "surface-container": "#f1eee7",
              "on-primary-container": "#3b4325",
              "surface-container-lowest": "#ffffff",
              "on-primary-fixed-variant": "#424a2c",
              "surface": "#fcf9f2",
              "tertiary-container": "#c2a3bb",
              "primary-fixed-dim": "#c2cba3",
              "secondary-fixed": "#fadcd1",
              "on-error-container": "#93000a",
              "on-background": "#1c1c18",
              "on-secondary": "#ffffff",
              "surface-dim": "#dcdad3",
              "surface-container-low": "#f6f3ec",
              "surface-tint": "#5a6241",
              "on-tertiary-fixed": "#291527",
              "on-secondary-container": "#756057",
              "surface-bright": "#fcf9f2",
              "inverse-on-surface": "#f3f0e9",
              "secondary-container": "#fadcd1",
              "surface-container-highest": "#e5e2db",
              "on-secondary-fixed": "#271811",
              "surface-container-high": "#ebe8e1",
              "primary": "#5a6241",
              "on-primary": "#ffffff",
              "error-container": "#ffdad6",
              "outline-variant": "#c7c7bb",
              "primary-fixed": "#dee7be",
              "error": "#ba1a1a",
              "on-tertiary-container": "#50394d",
              "on-secondary-fixed-variant": "#56423a",
              "on-tertiary-fixed-variant": "#573f53",
              "tertiary-fixed": "#fbd9f2",
              "surface-variant": "#e5e2db",
              "on-tertiary": "#ffffff",
              "on-surface": "#1c1c18",
              "tertiary-fixed-dim": "#ddbdd6",
              "tertiary": "#70566c",
              "background": "#fcf9f2"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .viewfinder-dashed {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='32' ry='32' stroke='%238D6B4A' stroke-width='3' stroke-dasharray='12%2c 12' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
            border-radius: 2rem;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  
        @keyframes pulse-glow {
            0% { transform: scale(1); opacity: 0.5; box-shadow: 0 0 0 0 rgba(141, 107, 74, 0.4); }
            70% { transform: scale(1.05); opacity: 0.8; box-shadow: 0 0 0 15px rgba(141, 107, 74, 0); }
            100% { transform: scale(1); opacity: 0.5; box-shadow: 0 0 0 0 rgba(141, 107, 74, 0); }
        }
        .scan-ring-pulse {
            animation: pulse-glow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 z-50 flex justify-between items-center px-6 py-4 w-full bg-[#fcf9f2] dark:bg-[#1c1c18]">
<div class="flex items-center gap-4">
<button class="text-[#5a6241] dark:text-[#a7b08a] hover:bg-[#f1eee7]/50 dark:hover:bg-[#262621]/50 transition-colors p-2 rounded-full active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="text-2xl font-bold text-[#1c1c18] dark:text-[#fcf9f2] italic font-['Plus_Jakarta_Sans'] tracking-tight">DermaLens</h1>
</div>
<button class="text-[#5a6241] dark:text-[#a7b08a] hover:bg-[#f1eee7]/50 dark:hover:bg-[#262621]/50 transition-colors p-2 rounded-full active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">notifications</span>
</button>
</header>
<div class="bg-[#f1eee7] dark:bg-[#262621] h-px w-full"></div>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col items-center px-8 pt-10 pb-32 max-w-md mx-auto w-full">
<!-- Header Editorial -->
<div class="w-full mb-10 text-left">
<h2 class="text-[1.75rem] font-bold text-on-surface leading-tight tracking-tight">Skin Scan</h2>
<p class="text-on-surface-variant mt-2 text-sm leading-relaxed">Align the area of interest to begin your analysis.</p>
</div>
<!-- Camera Viewfinder -->
<div class="relative w-full aspect-square max-w-[320px] mb-10">
<div class="absolute inset-0 viewfinder-dashed flex flex-col items-center justify-center p-6 bg-surface-container-low/40 backdrop-blur-[2px]">
<div class="flex flex-col items-center justify-center h-full w-full relative">
<!-- Minimal Circular Scan Ring -->
<div class="w-48 h-48 rounded-full border border-[#8D6B4A] scan-ring-pulse flex items-center justify-center">
<div class="w-44 h-44 rounded-full border border-[#8D6B4A]/30"></div>
</div>
<!-- Instruction Text -->
<div class="absolute bottom-8 w-full text-center">
<span class="text-xs font-medium text-[#8D6B4A] tracking-wide">Position lesion within frame</span>
</div>
</div>
</div>
</div>
<!-- Action Cluster -->
<div class="w-full space-y-4">
<button class="w-full py-5 rounded-full bg-[#1c1c18] text-white font-bold text-lg active:scale-[0.98] transition-all flex items-center justify-center gap-3 shadow-lg shadow-[#1c1c18]/10">
<span class="material-symbols-outlined">center_focus_weak</span>
                Scan Now
            </button>
<button class="w-full py-4 rounded-full bg-primary-container text-on-primary-container font-semibold active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined">cloud_upload</span>
                Upload from Gallery
            </button>
</div>
<!-- Tip Card -->
<div class="mt-8 w-full">
<div class="bg-[#5B3A2A] p-5 rounded-lg flex items-start gap-4 shadow-sm">
<div class="mt-1 bg-white/20 p-2 rounded-full">
<span class="material-symbols-outlined text-white text-sm" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
<div>
<h4 class="text-white/80 text-[10px] font-bold uppercase tracking-widest mb-1">Dermatologist Tip</h4>
<p class="text-white text-sm font-medium leading-snug">Ensure good lighting for best results. Indirect sunlight is ideal.</p>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-8 py-4 pb-safe bg-[#1c1c18] dark:bg-[#12120f] rounded-t-[2rem] z-50 shadow-[0_-8px_24px_rgba(28,28,24,0.06)]">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-[#a7b08a] text-[#3b4325] rounded-full p-3 active:scale-90 transition-all duration-300 ease-out" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
</a>
<!-- History -->
<a class="flex flex-col items-center justify-center text-[#fcf9f2]/60 p-3 hover:text-[#fcf9f2] transition-all active:scale-90 transition-all duration-300 ease-out" href="#">
<span class="material-symbols-outlined">history</span>
</a>
<!-- Results (Analytics) -->
<a class="flex flex-col items-center justify-center text-[#fcf9f2]/60 p-3 hover:text-[#fcf9f2] transition-all active:scale-90 transition-all duration-300 ease-out" href="#">
<span class="material-symbols-outlined">analytics</span>
</a>
<!-- Profile (Person) -->
<a class="flex flex-col items-center justify-center text-[#fcf9f2]/60 p-3 hover:text-[#fcf9f2] transition-all active:scale-90 transition-all duration-300 ease-out" href="#">
<span class="material-symbols-outlined">person</span>
</a>
</nav>
</body></html>
