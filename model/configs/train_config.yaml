model:
  name: FairDermNet
  backbone: mobilenetv3_large_100
  pretrained: true
  num_classes: 8
  num_skin_tones: 6
  input_size: [224, 224, 3]

training:
  batch_size: 16  # Reduced for 4GB VRAM (RTX 2050)
  gradient_accumulation_steps: 4  # Effective batch size = 64
  epochs: 80  # Increased from 30/50 for better convergence
  learning_rate: 0.00005  # Reduced for smoother convergence (5e-5)
  optimizer: adamw
  weight_decay: 0.0001
  lr_scheduler: cosine_annealing_warm_restarts
  early_stopping_patience: 15  # Increased patience
  gradient_clip_norm: 5.0  # Prevent gradient explosion
  mixed_precision: true  # FP16 for memory efficiency

  loss:
    alpha: 1.0  # Classification loss
    beta: 0.15  # Fitzpatrick auxiliary loss
    gamma: 0.5  # Fairness gap loss (DOUBLED from 0.25)

data:
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  stratify_by: [class, skin_tone]

augmentation:
  rotation_range: 180
  horizontal_flip: true
  vertical_flip: true
  brightness_range: [0.8, 1.2]
  contrast_range: [0.8, 1.2]
  hue_shift_limit: 10
  mixup_alpha: 0.2

export:
  quantization: int8
  target_size_mb: 6
  target_latency_ms: 25
