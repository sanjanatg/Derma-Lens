name: dermalens_app
description: A premium skin health application with a Tactile Apothecary aesthetic.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  camera: ^0.11.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.5.5
  tflite_flutter: ^0.10.4   # Real on-device inference via TFLite C API
  image: ^4.1.7             # Pixel-level image decode/resize for preprocessing

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/labels.txt
    - assets/fairdermnet_int8.tflite     # INT8-quantized model (<6 MB)
    - assets/threshold_config.json       # Clinical threshold + metadata
